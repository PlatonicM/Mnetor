<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">

<title>{% block subject %}Mentor Email{% endblock %}</title>

<style>
  /* CLIENT-SAFE CSS */
  body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
      margin:0; padding:20px;
  }
  .email-wrapper {
      max-width: 600px;
      margin: auto;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e2e2e2;
  }
  .email-header {
      background: #1b7ced;
      padding: 20px;
      text-align: center;
      color: #fff;
  }
  .email-header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 1px;
  }
  .email-body {
      padding: 25px;
      color: #333;
      font-size: 15px;
      line-height: 1.6;
  }
  .email-footer {
      text-align: center;
      font-size: 13px;
      color: #666;
      padding: 18px;
      background: #fafafa;
      border-top: 1px solid #eee;
  }
  .btn-primary {
      display: inline-block;
      background: #1b7ced;
      color:white !important;
      padding: 12px 20px;
      text-decoration:none;
      border-radius:6px;
      margin-top: 10px;
  }
  .divider {
      margin: 25px 0;
      border-top: 1px solid #eee;
  }
</style>
</head>

<body>

<div class="email-wrapper">

  <!-- HEADER -->
  <div class="email-header">
    <h1>Mentor LMS</h1>
    {% block header_tagline %}
    <div style="font-size:13px; opacity:0.9; margin-top:4px;">
      Learning • Events • Community
    </div>
    {% endblock %}
  </div>

  <!-- BODY CONTENT -->
  <div class="email-body">
    {% block content %}
    <!-- Email-specific content will appear here -->
    {% endblock %}
  </div>

  <!-- FOOTER -->
  <div class="email-footer">
    © {{ year|default:2025 }} Mentor LMS<br>
    This is an automated email — please do not reply.
    <div style="margin-top:6px;">
      <a href="#" style="color:#1b7ced; text-decoration:none;">Visit Website</a> •
      <a href="#" style="color:#1b7ced; text-decoration:none;">Unsubscribe</a>
    </div>
  </div>

</div>

</body>
</html>
