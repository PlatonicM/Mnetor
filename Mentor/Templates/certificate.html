<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            text-align:center; 
            font-family: Arial; 
            background:#fdfdfd; 
            padding:40px;
            border: 10px solid #222;
        }
        .title {
            font-size: 38px;
            font-weight: bold;
            margin-top: 20px;
            color: #222;
        }
        .name {
            font-size: 30px;
            margin-top: 15px;
        }
        .course {
            font-size: 26px;
            margin-top: 10px;
            font-weight:bold;
        }
        .footer {
            margin-top: 40px;
            font-size: 16px;
            color:#555;
        }
    </style>
</head>
<body>

    <div class="title">Certificate of Completion</div>

    <p class="name">{{ user.first_name }} {{ user.last_name }}</p>

    <p>has successfully completed the course:</p>

    <p class="course">"{{ course.name }}"</p>

    <p class="footer">
        Certificate ID: {{ cert.cert_id }} <br>
        Generated on: {{ cert.generated_on }}
    </p>

</body>
</html>
