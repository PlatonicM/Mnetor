<div class="bento-card reveal shadow-premium" style="background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); padding: 30px; border-radius: 20px;">
    <div class="d-flex align-items-center gap-3 mb-4">
        <div class="rounded-circle bg-primary-soft p-3">
            <i class="bi bi-envelope-at-fill text-primary h4 mb-0"></i>
        </div>
        <div>
            <h5 class="fw-bold mb-0 text-dark">Subscribe to Newsletter</h5>
            <p class="extra-small text-muted fw-semibold mb-0">Get the latest course releases and career guides</p>
        </div>
    </div>

    <form id="ajax-sync-form" action="{% url 'subscribe_node' %}" method="POST" class="position-relative">
        {% csrf_token %}
        <div class="input-group mb-3">
            <input type="email" name="email" id="sync-email"
                   class="form-control border-0 bg-light rounded-start-pill px-4 py-3 small fw-semibold" 
                   placeholder="you@example.com" required>
            <button type="submit" id="sync-btn" class="btn btn-primary rounded-end-pill px-4 fw-bold shadow-sm">
                <span class="btn-text">Subscribe</span>
                <span class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
        </div>
        
        <div id="sync-status" class="extra-small fw-bold mt-2 d-none"></div>

        <p class="extra-small text-muted mb-0 opacity-75 mt-2" id="encryption-tag">
            <i class="bi bi-shield-check me-1"></i> Your email is safe with us. Zero spam guaranteed.
        </p>
    </form>
</div>

<style>
    .bg-primary-soft { background: rgba(79, 70, 229, 0.1); }
    .shadow-glow { box-shadow: 0 0 15px rgba(79, 70, 229, 0.3); transition: all 0.3s ease; }
    .shadow-glow:hover { box-shadow: 0 0 25px rgba(79, 70, 229, 0.5); }
    
    /* AJAX State Transitions */
    .sync-success { color: #10b981 !important; }
    .sync-error { color: #ef4444 !important; }

    .form-control:focus {
        box-shadow: none;
        background: #ffffff !important;
        border: 1px solid #4f46e5 !important;
    }
</style>

<script>
document.getElementById('ajax-sync-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const form = this;
    const btn = document.getElementById('sync-btn');
    const btnText = btn.querySelector('.btn-text');
    const spinner = btn.querySelector('.spinner-border');
    const statusMsg = document.getElementById('sync-status');
    const emailInput = document.getElementById('sync-email');

    btn.disabled = true;
    btnText.innerText = "Subscribing...";
    spinner.classList.remove('d-none');
    statusMsg.classList.add('d-none');

    const formData = new FormData(form);

    fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
        }
    })
    .then(response => response.json())
    .then(data => {
        spinner.classList.add('d-none');
        statusMsg.classList.remove('d-none');

        if (data.status === 'success') {
            btn.classList.replace('btn-primary', 'btn-success');
            btnText.innerText = "Subscribed!";
            statusMsg.innerText = "✓ Success! Thank you for subscribing.";
            statusMsg.className = "extra-small fw-bold mt-2 sync-success";
            emailInput.value = '';
        } else {
            btn.disabled = false;
            btnText.innerText = "Retry";
            statusMsg.innerText = "Error: " + (data.message || "Subscription failed.");
            statusMsg.className = "extra-small fw-bold mt-2 sync-error";
        }
    })
    .catch(error => {
        spinner.classList.add('d-none');
        btn.disabled = false;
        btnText.innerText = "Retry";
        statusMsg.classList.remove('d-none');
        statusMsg.innerText = "Connection error. Please try again.";
        statusMsg.className = "extra-small fw-bold mt-2 sync-error";
    });
});
</script>
